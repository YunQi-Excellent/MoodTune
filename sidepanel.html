<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  :root {
    --brand-500: #10b981;
    --brand-600: #059669;
    --brand-400: #34d399;
    --brand-50: rgba(16, 185, 129, 0.08);
    --brand-100: rgba(16, 185, 129, 0.15);
    --brand-ring: rgba(16, 185, 129, 0.25);

    --yellow-500: #f59e0b;
    --yellow-600: #d97706;
    --yellow-50: rgba(245, 158, 11, 0.12);

    --danger: #ef4444;
    --success: #10b981;

    --fg-0: #0f172a;
    --fg-1: #334155;
    --fg-2: #64748b;
    --fg-3: #94a3b8;
    --border: rgba(15, 23, 42, 0.08);

    --glass-opacity: 0.85;
    --card-opacity: 0.72;
    --glass-blur: 24px;

    --glass-bg: rgba(255, 255, 255, var(--glass-opacity));
    --glass-border: rgba(255, 255, 255, 0.95);
    --card-bg: rgba(255, 255, 255, var(--card-opacity));
    --card-border: rgba(255, 255, 255, 0.95);
    --soft-bg: rgba(255, 255, 255, 0.6);
    --soft-hover: rgba(15, 23, 42, 0.04);
  }

  html.dark {
    --fg-0: #fafafa;
    --fg-1: #d4d4d8;
    --fg-2: #a1a1aa;
    --fg-3: #71717a;
    --border: rgba(255, 255, 255, 0.08);

    --glass-bg: rgba(22, 24, 29, var(--glass-opacity));
    --glass-border: rgba(255, 255, 255, 0.12);
    --card-bg: rgba(30, 33, 40, var(--card-opacity));
    --card-border: rgba(255, 255, 255, 0.08);
    --soft-bg: rgba(255, 255, 255, 0.05);
    --soft-hover: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--fg-0);
    min-width: 320px;
    position: relative;
    background:
      radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.18), transparent 45%),
      radial-gradient(circle at 100% 35%, rgba(245, 158, 11, 0.14), transparent 45%),
      radial-gradient(circle at 20% 95%, rgba(239, 68, 68, 0.06), transparent 40%),
      linear-gradient(135deg, #f4f6f9 0%, #e5e9f0 100%);
    background-attachment: fixed;
  }
  html.dark body {
    background:
      radial-gradient(circle at 0% 0%, rgba(16, 185, 129, 0.14), transparent 45%),
      radial-gradient(circle at 100% 35%, rgba(245, 158, 11, 0.09), transparent 45%),
      radial-gradient(circle at 20% 95%, rgba(239, 68, 68, 0.06), transparent 40%),
      #090a0f;
    background-attachment: fixed;
  }

  /* 顶部 Header：分层微光排版，空间从容 */
  header {
    flex-shrink: 0;
    display: flex; flex-direction: column; gap: 6px;
    padding: 8px 14px 6px;
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    border-bottom: 1px solid var(--border);
    z-index: 10;
    box-shadow: 0 4px 20px -5px rgba(0, 0, 0, 0.03);
  }
  .header-main {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; gap: 8px;
  }
  .session-btn {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 12px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    font-size: 12px; font-weight: 600;
    color: var(--fg-0); cursor: pointer;
    flex: 1; max-width: 180px; min-width: 0;
    box-shadow: 0 2px 8px -2px rgba(0, 0, 0, 0.05);
    transition: all 0.15s;
  }
  .session-btn:hover { background: #fff; transform: translateY(-1px); }
  html.dark .session-btn:hover { background: rgba(255, 255, 255, 0.1); }
  .session-btn .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--brand-500);
    box-shadow: 0 0 8px var(--brand-500);
    flex-shrink: 0;
  }
  .session-btn .name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1; text-align: left;
  }

  /* 模型名称副行 */
  .header-sub {
    display: flex; align-items: center; gap: 6px;
    padding-left: 2px;
  }
  .model-badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 2px 8px;
    background: var(--brand-50);
    color: var(--brand-600);
    border: 1px solid var(--brand-ring);
    border-radius: 999px;
    font-size: 10px;
    font-family: ui-monospace, monospace;
    font-weight: 600;
    width: fit-content;
  }
  .model-badge .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--brand-500);
    box-shadow: 0 0 6px var(--brand-500);
  }
  html.dark .model-badge {
    background: var(--brand-100);
    color: var(--brand-400);
  }
  .model-badge.off {
    background: var(--soft-bg);
    color: var(--fg-3);
    border-color: var(--border);
  }
  .model-badge.off .dot { background: var(--fg-3); box-shadow: none; }

  .header-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .icon-btn {
    width: 28px; height: 28px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 0; border-radius: 50%;
    color: var(--fg-2); cursor: pointer; font-size: 14px;
    transition: all 0.15s;
  }
  .icon-btn:hover { background: var(--soft-hover); color: var(--fg-0); }

  /* ========================================================
   * 1. 真实连续型 Git 树流转主视区 (用户卡片为主，AI 分支明显缩进)
   * ======================================================== */
  main.chat {
    flex: 1 1 auto;
    overflow-y: auto; min-height: 0;
    padding: 14px 14px 14px 10px;
    display: flex; flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
    position: relative;
    z-index: 1;
  }
  main.chat::-webkit-scrollbar { width: 5px; }
  main.chat::-webkit-scrollbar-thumb {
    background: rgba(15, 23, 42, 0.12);
    border-radius: 3px;
  }
  html.dark main.chat::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.1);
  }

  .msg-user, .msg-agent {
    width: 100%;
    display: flex;
    align-items: flex-start;
    position: relative;
  }

  /* 用户发言：靠近主轴，作为主要 Commit 节点展示 */
  .msg-user .user-track {
    width: 24px;
    align-self: stretch;
    position: relative;
    flex-shrink: 0;
  }
  .msg-user .user-track .git-trunk-line {
    position: absolute;
    left: 10px; width: 3px;
    top: -12px; bottom: -12px;
    background: #cbd5e1;
    z-index: 1;
  }
  html.dark .msg-user .user-track .git-trunk-line {
    background: #334155;
  }
  .msg-user:first-child .user-track .git-trunk-line {
    top: 16px;
  }
  main.chat > :last-child .user-track .git-trunk-line {
    bottom: calc(100% - 18px);
  }
  .msg-user .user-track .git-trunk-dot {
    position: absolute;
    left: 4px; top: 12px;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: #0f172a;
    border: 2.5px solid #fff;
    box-shadow: 0 0 0 2px rgba(15, 23, 42, 0.18);
    z-index: 4;
  }
  html.dark .msg-user .user-track .git-trunk-dot {
    background: #f1f5f9;
    border-color: #0f172a;
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25);
  }

  /* 用户卡片：紧贴主干、尺寸略大、圆角更舒展 (图 1 用户为主感) */
  .msg-user .bubble {
    flex: 1; min-width: 0;
    margin-left: 6px;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 12px 16px;
    box-shadow: 0 4px 18px -4px rgba(0, 0, 0, 0.05), inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.95);
  }
  html.dark .msg-user .bubble {
    box-shadow: 0 4px 18px -4px rgba(0, 0, 0, 0.35), inset 0 1px 1px 0 rgba(255, 255, 255, 0.08);
  }
  .user-meta {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 10.5px; font-family: ui-monospace, monospace;
    color: var(--fg-3); margin-bottom: 5px;
  }
  .user-meta .tag { font-weight: 700; color: var(--fg-2); }
  .msg-user .text { font-size: 13.5px; color: var(--fg-0); font-weight: 500; line-height: 1.55; }

  /* AI 动作节点：更宽的轨道 (46px)，卡片右移缩进 22px，分支感强烈 */
  .msg-agent .agent-track {
    width: 46px;
    align-self: stretch;
    position: relative;
    flex-shrink: 0;
  }
  /* AI 节点左侧保留主轴贯穿 */
  .msg-agent .agent-track .git-trunk-line {
    position: absolute;
    left: 10px; width: 3px;
    top: -12px; bottom: -12px;
    background: #cbd5e1;
    z-index: 1;
  }
  html.dark .msg-agent .agent-track .git-trunk-line {
    background: #334155;
  }
  main.chat > :last-child .agent-track .git-trunk-line {
    bottom: calc(100% - 18px);
  }

  /* AI 分支曲线 (首个 AI 节点从主轴 X=11.5px 弯折到 X=33.5px) */
  .agent-track .git-branch-curve {
    position: absolute;
    left: 0; top: 0;
    width: 46px; height: 32px;
    overflow: visible;
    pointer-events: none;
    z-index: 2;
  }

  /* AI 分支垂直绿线 (X=32px，宽 3px) */
  .agent-track .git-branch-line {
    position: absolute;
    left: 32px; width: 3px;
    top: 16px; bottom: -12px;
    background: var(--brand-500);
    z-index: 2;
  }
  .msg-agent:not(.branch-start) .agent-track .git-branch-line {
    top: -12px;
  }
  .msg-agent:not(:has(+ .msg-agent)) .agent-track .git-branch-line {
    bottom: calc(100% - 18px);
  }

  /* AI 分支 Commit 节点圆点 (X=26px，居中对齐分支线 X=33.5px) */
  .agent-track .git-branch-dot {
    position: absolute;
    left: 26px; top: 12px;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: var(--brand-500);
    border: 2.5px solid #fff;
    box-shadow: 0 0 8px rgba(16, 185, 129, 0.45);
    z-index: 4;
  }
  html.dark .agent-track .git-branch-dot { border-color: #0f172a; }
  .msg-agent.eq-card .agent-track .git-branch-dot,
  .msg-agent.thinking .agent-track .git-branch-dot {
    background: var(--yellow-500);
    box-shadow: 0 0 8px rgba(245, 158, 11, 0.45);
  }

  /* AI 卡片：右移缩进、紧凑规整圆角矩形 */
  .msg-agent .body {
    flex: 1; min-width: 0;
    margin-left: 6px;
    background: var(--card-bg);
    backdrop-filter: blur(18px) saturate(180%);
    -webkit-backdrop-filter: blur(18px) saturate(180%);
    border: 1px solid var(--card-border);
    border-radius: 18px;
    padding: 10px 14px;
    font-size: 13px; line-height: 1.55;
    word-break: break-word;
    box-shadow: 0 4px 18px -4px rgba(0, 0, 0, 0.04), inset 0 1px 1px 0 rgba(255, 255, 255, 0.9);
  }
  html.dark .msg-agent .body {
    box-shadow: 0 4px 18px -4px rgba(0, 0, 0, 0.35), inset 0 1px 1px 0 rgba(255, 255, 255, 0.08);
  }
  .msg-agent.ack .body {
    padding: 8px 12px;
    font-size: 12px; color: var(--fg-2);
    background: var(--soft-bg);
    border: 1px dashed var(--border);
    box-shadow: none; font-style: italic;
  }

  /* 思考节点 (黄色适中点缀) */
  .msg-agent.thinking .body {
    padding: 0; overflow: hidden;
    background: var(--soft-bg);
    border: 1px solid var(--card-border);
  }
  .thinking-toggle {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
    color: var(--yellow-600);
    font-size: 12px; font-weight: 600;
    transition: background 0.15s;
  }
  html.dark .thinking-toggle { color: var(--yellow-500); }
  .thinking-toggle:hover { background: var(--soft-hover); }
  .thinking-toggle .chevron {
    display: inline-block;
    transition: transform 0.2s;
    color: var(--yellow-500);
    font-size: 9px;
  }
  .thinking-toggle.open .chevron { transform: rotate(90deg); }
  .thinking-toggle .spinner {
    width: 10px; height: 10px;
    border: 2px solid var(--border);
    border-top-color: var(--yellow-500);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }
  .thinking-toggle.done .spinner { display: none; }
  .thinking-toggle .elapsed {
    margin-left: auto;
    color: var(--fg-3);
    font-size: 10px;
    font-variant-numeric: tabular-nums;
  }
  .thinking-content {
    display: none;
    padding: 0 14px 12px;
    color: var(--fg-2);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 220px;
    overflow-y: auto;
  }
  .thinking-content.open { display: block; }
  .thinking-content.cursor::after {
    content: '▊';
    color: var(--yellow-500);
    animation: blink 1s steps(2) infinite;
    margin-left: 1px;
  }
  @keyframes blink { to { opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* 计划卡片 */
  .plan-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .plan-title {
    font-weight: 700; font-size: 13px;
    display: flex; align-items: center; gap: 6px;
    color: var(--fg-0);
  }
  .badge {
    font-size: 10px; padding: 2px 8px;
    background: var(--brand-50);
    color: var(--brand-600);
    border: 1px solid var(--brand-ring);
    border-radius: 999px;
    font-weight: 700;
  }
  html.dark .badge {
    background: var(--brand-100);
    color: var(--brand-400);
  }
  .badge.yellow {
    background: var(--yellow-50);
    color: var(--yellow-600);
    border-color: rgba(245, 158, 11, 0.25);
  }
  html.dark .badge.yellow {
    color: var(--yellow-500);
    background: rgba(245, 158, 11, 0.14);
  }
  .stats-line {
    font-size: 11px; color: var(--fg-2);
    padding: 6px 10px;
    background: var(--soft-bg);
    border-radius: 10px;
    margin-bottom: 8px;
    border: 1px solid var(--border);
  }
  .stats-line.yellow {
    background: var(--yellow-50);
    border-color: rgba(245, 158, 11, 0.25);
    color: var(--yellow-600);
  }
  html.dark .stats-line.yellow { color: var(--yellow-500); }

  .track-list {
    display: flex; flex-direction: column;
    gap: 3px; margin-bottom: 8px;
    max-height: 260px; overflow-y: auto;
  }
  .track-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 12px;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .track-item:hover { background: var(--soft-hover); }
  .track-item input[type=checkbox] {
    accent-color: var(--brand-500);
    cursor: pointer; flex-shrink: 0;
    width: 15px; height: 15px;
  }
  .track-item .cover {
    width: 32px; height: 32px; border-radius: 8px;
    object-fit: cover;
    background: var(--soft-bg);
    flex-shrink: 0;
  }
  .track-item .info { flex: 1; min-width: 0; }
  .track-item .title {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-weight: 600; color: var(--fg-0);
  }
  .track-item .artist {
    font-size: 11px; color: var(--fg-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .track-item .reason {
    font-size: 10px; color: var(--brand-600);
    margin-top: 1px;
  }
  html.dark .track-item .reason { color: var(--brand-400); }

  .card-actions {
    display: flex; gap: 6px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .btn {
    padding: 8px 16px;
    border: 0; border-radius: 999px;
    background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
    color: #fff;
    font-size: 12px; font-weight: 700;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    transition: all 0.15s;
    flex: 1;
    box-shadow: 0 4px 14px -2px rgba(16, 185, 129, 0.45);
  }
  .btn:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 18px -2px rgba(16, 185, 129, 0.55);
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.ghost {
    background: var(--soft-bg);
    color: var(--fg-1);
    border: 1px solid var(--border);
    box-shadow: none;
  }
  .btn.ghost:hover:not(:disabled) { background: var(--soft-hover); }

  /* EQ 卡片 */
  .eq-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .eq-header .title { font-weight: 700; font-size: 13px; color: var(--fg-0); }
  .eq-slider {
    display: grid; grid-template-columns: 60px 1fr 52px;
    gap: 6px; align-items: center;
    margin-bottom: 5px;
    font-size: 11px;
  }
  .eq-slider .label {
    color: var(--fg-2);
    font-variant-numeric: tabular-nums;
    font-weight: 500;
  }
  .eq-slider .label.strong { color: var(--fg-0); font-weight: 700; }
  .eq-slider input[type=range] {
    width: 100%; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: var(--soft-bg);
    border-radius: 2px;
    cursor: pointer;
    border: 1px solid var(--border);
  }
  .eq-slider input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--yellow-500);
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(245, 158, 11, 0.45);
    cursor: pointer;
    transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .eq-slider input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.22); }
  html.dark .eq-slider input[type=range]::-webkit-slider-thumb { border-color: #1e2026; }
  .eq-slider .value {
    text-align: right;
    color: var(--yellow-600);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  html.dark .eq-slider .value { color: var(--yellow-500); }
  .eq-divider {
    border: 0;
    border-top: 1px solid var(--border);
    margin: 8px 0;
  }

  .save-card { display: flex; align-items: center; gap: 10px; }
  .save-card .icon {
    width: 32px; height: 32px;
    border-radius: 10px;
    background: rgba(16, 185, 129, 0.14);
    color: var(--success);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .save-card .text { font-size: 12px; }
  .save-card .text b { color: var(--fg-0); }

  .error-card {
    display: flex; gap: 8px; align-items: flex-start;
    color: var(--danger);
  }

  /* ========================================================
   * 2. 悬浮圆角播放栏 (Apple Music 风格控制集群 + 宽裕音量条)
   * ======================================================== */
  .player {
    flex-shrink: 0;
    margin: 0 14px 10px 14px;
    padding: 12px 16px 14px;
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    box-shadow: 0 14px 34px -8px rgba(0, 0, 0, 0.08), inset 0 1px 1px 0 rgba(255, 255, 255, 0.95);
    z-index: 20;
    overflow: hidden;
  }
  html.dark .player {
    box-shadow: 0 14px 38px -8px rgba(0, 0, 0, 0.55), inset 0 1px 1px 0 rgba(255, 255, 255, 0.12);
  }
  
  /* 歌曲信息与黑胶唱片占位 */
  .player-info-row {
    display: flex; align-items: center; gap: 11px;
    margin-bottom: 9px;
  }
  .player-cover-wrap {
    width: 42px; height: 42px;
    border-radius: 13px;
    background: rgba(15, 23, 42, 0.05);
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.1);
  }
  html.dark .player-cover-wrap {
    background: rgba(255, 255, 255, 0.06);
  }
  .player-cover-wrap .vinyl-icon {
    font-size: 20px; color: var(--fg-3); opacity: 0.6;
  }
  .player-cover {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 13px;
    z-index: 2;
  }
  .player-text { min-width: 0; flex: 1; }
  .player-title {
    font-size: 13px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--fg-0); letter-spacing: -0.2px;
  }
  .player-artist {
    font-size: 11px; color: var(--fg-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    margin-top: 1px;
  }
  
  /* 进度条 */
  .player-progress-row {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 10px;
  }
  .player-time {
    font-size: 10px; color: var(--fg-3);
    font-variant-numeric: tabular-nums;
    font-family: ui-monospace, monospace;
    flex-shrink: 0; width: 32px; text-align: center;
  }
  .player-seek {
    flex: 1; height: 4px;
    -webkit-appearance: none; appearance: none;
    background: rgba(15, 23, 42, 0.08);
    border-radius: 2px;
    cursor: pointer;
    border: 0;
  }
  html.dark .player-seek { background: rgba(255, 255, 255, 0.12); }
  .player-seek::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--brand-500);
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(16, 185, 129, 0.5);
    cursor: pointer;
  }
  html.dark .player-seek::-webkit-slider-thumb { border-color: #1e2026; }

  /* Apple Music 风格控制排版：左右双集群对齐 */
  .player-controls {
    display: flex; align-items: center;
    width: 100%; min-width: 0;
    justify-content: space-between;
  }
  
  /* 左侧主播放集群 (Prev, Big Play, Next) */
  .player-playback-group {
    display: flex; align-items: center; gap: 8px;
  }
  .player-btn {
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 0; border-radius: 50%;
    color: var(--fg-1); cursor: pointer; font-size: 15px;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .player-btn:hover:not(:disabled) {
    background: var(--soft-hover);
    color: var(--fg-0);
  }
  .player-btn:disabled { opacity: 0.4; }
  
  /* 核心翠绿大播放键 (42px) */
  .player-btn.primary {
    background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
    color: #fff;
    width: 42px; height: 42px; font-size: 16px;
    box-shadow: 0 4px 16px -2px rgba(16, 185, 129, 0.5);
  }
  .player-btn.primary:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--brand-600), #047857);
    transform: scale(1.06);
  }

  /* 右侧音频设施集群 (Queue 会话歌单 + 宽裕音量滑块) */
  .player-actions-group {
    display: flex; align-items: center; gap: 12px;
  }
  .player-cart-btn {
    position: relative;
    width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--soft-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    font-size: 14px;
    color: var(--fg-1);
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .player-cart-btn:hover {
    background: var(--soft-hover);
    transform: scale(1.05);
  }
  .player-cart-btn.has-items {
    background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
    color: #fff;
    border-color: var(--brand-500);
    box-shadow: 0 4px 14px -2px rgba(16, 185, 129, 0.45);
  }
  .player-cart-btn .cart-badge {
    position: absolute;
    top: -4px; right: -6px;
    min-width: 18px; height: 18px;
    padding: 0 5px;
    background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    font-family: ui-monospace, monospace;
    border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff;
    box-shadow: 0 2px 8px rgba(16, 185, 129, 0.5);
    line-height: 1;
    animation: badgePop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  html.dark .player-cart-btn .cart-badge { border-color: #1e2026; }
  .player-cart-btn .cart-badge.hidden { display: none; }
  @keyframes badgePop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }

  /* 音量滑块：宽裕至 115px、加粗至 6px、带安全边距绝对防溢出 */
  .player-volume-wrap {
    display: flex; align-items: center; gap: 8px;
    width: 115px;
    flex-shrink: 0;
    box-sizing: border-box;
  }
  .player-volume {
    width: 100%;
    height: 6px;
    -webkit-appearance: none; appearance: none;
    background: rgba(15, 23, 42, 0.14);
    border-radius: 999px;
    cursor: pointer;
    border: 0;
    outline: none;
  }
  html.dark .player-volume {
    background: rgba(255, 255, 255, 0.18);
  }
  .player-volume::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--brand-500);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .player-volume::-webkit-slider-thumb:hover { transform: scale(1.2); }
  html.dark .player-volume::-webkit-slider-thumb {
    background: #f8fafc;
    border-color: var(--brand-500);
  }

  /* 3. 底部悬浮圆角输入坞 (最底层) */
  footer.input-bar {
    flex-shrink: 0;
    margin: 0 14px 14px 14px;
    padding: 6px 8px 6px 12px;
    background: var(--glass-bg);
    backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(180%);
    border: 1px solid var(--glass-border);
    border-radius: 22px;
    display: flex; gap: 6px; align-items: flex-end;
    box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.1), inset 0 1px 1px 0 rgba(255, 255, 255, 0.95);
    z-index: 20;
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  html.dark footer.input-bar {
    box-shadow: 0 12px 32px -8px rgba(0, 0, 0, 0.5), inset 0 1px 1px 0 rgba(255, 255, 255, 0.08);
  }
  footer.input-bar:focus-within {
    border-color: var(--brand-500);
    box-shadow: 0 12px 32px -8px rgba(16, 185, 129, 0.25), inset 0 1px 1px 0 rgba(255, 255, 255, 0.95), 0 0 0 3px var(--brand-ring);
  }
  .dock-toggle {
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    background: transparent; border: 0; border-radius: 50%;
    color: var(--fg-2); cursor: pointer; font-size: 14px;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .dock-toggle:hover {
    background: var(--soft-hover);
    color: var(--brand-500);
  }
  #userInput {
    flex: 1;
    background: transparent; border: 0; outline: none;
    resize: none; max-height: 90px;
    font: inherit; font-size: 13px;
    color: var(--fg-0);
    line-height: 1.5;
    padding: 6px 2px;
    min-height: 30px;
  }
  #userInput::placeholder { color: var(--fg-3); }
  .send-btn {
    width: 32px; height: 32px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
    color: #fff; border: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 700;
    transition: all 0.15s;
    flex-shrink: 0;
    box-shadow: 0 4px 12px -2px rgba(16, 185, 129, 0.45);
  }
  .send-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px -2px rgba(16, 185, 129, 0.55);
  }
  .send-btn:active { transform: scale(0.94); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .stop-btn {
    width: 32px; height: 32px;
    border-radius: 12px;
    background: linear-gradient(135deg, #ef4444, #dc2626);
    color: #fff; border: 0; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    font-size: 12px;
    transition: all 0.15s;
    flex-shrink: 0;
    box-shadow: 0 4px 12px -2px rgba(239, 68, 68, 0.45);
  }
  .stop-btn:hover { transform: translateY(-1px); }
  .stop-btn:active { transform: scale(0.94); }
  .stop-btn.show { display: inline-flex; }

  /* 抽屉系统 */
  .drawer {
    position: absolute;
    background: var(--glass-bg);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    z-index: 40;
    display: flex; flex-direction: column;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.12);
    border: 1px solid var(--glass-border);
  }
  html.dark .drawer { box-shadow: 0 0 40px rgba(0, 0, 0, 0.6); }

  #session-drawer {
    inset: 0 auto 0 0;
    width: 280px; max-width: 80%;
    transform: translateX(-100%);
    border-left: 0;
    border-top-right-radius: 26px;
    border-bottom-right-radius: 26px;
  }
  #session-drawer.open { transform: translateX(0); }

  #library-drawer {
    inset: 0 auto 0 0;
    width: 300px; max-width: 85%;
    transform: translateX(-100%);
    border-left: 0;
    border-top-right-radius: 26px;
    border-bottom-right-radius: 26px;
  }
  #library-drawer.open { transform: translateX(0); }

  #cart-drawer {
    inset: 0 0 0 auto;
    width: 320px; max-width: 88%;
    transform: translateX(100%);
    border-right: 0;
    border-top-left-radius: 26px;
    border-bottom-left-radius: 26px;
  }
  #cart-drawer.open { transform: translateX(0); }

  #log-drawer {
    inset: auto 0 0 0;
    height: 65%;
    transform: translateY(100%);
    background: rgba(13, 17, 23, 0.95);
    color: #c9d1d9;
    border-bottom: 0;
    border-radius: 26px 26px 0 0;
  }
  #log-drawer.open { transform: translateY(0); }
  #log-drawer .log-content {
    flex: 1; overflow-y: auto;
    padding: 10px 14px;
    font-family: ui-monospace, monospace;
    font-size: 11.5px; line-height: 1.55;
  }
  #log-drawer .log-line { padding: 2px 0; }
  #log-drawer .log-time { color: #6e7681; margin-right: 6px; }
  #log-drawer .log-level-info { color: #c9d1d9; }
  #log-drawer .log-level-ok { color: #7ee787; }
  #log-drawer .log-level-err { color: #ff7b72; }
  #log-drawer .log-level-stage { color: #79c0ff; font-weight: 600; }

  #dock-drawer {
    inset: auto 0 0 0;
    height: auto;
    transform: translateY(100%);
    border-bottom: 0;
    border-radius: 26px 26px 0 0;
    padding: 14px;
  }
  #dock-drawer.open { transform: translateY(0); }
  .dock-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .dock-item {
    display: flex; align-items: center; gap: 8px;
    padding: 10px;
    background: var(--soft-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    cursor: pointer;
    font-size: 11.5px;
    color: var(--fg-0);
    transition: all 0.15s;
    text-align: left;
  }
  .dock-item:hover {
    background: var(--brand-50);
    border-color: var(--brand-500);
    transform: translateY(-1px);
  }
  .dock-item .dock-icon { font-size: 16px; flex-shrink: 0; }
  .dock-item .dock-text { font-weight: 600; line-height: 1.2; }
  .dock-item .dock-sub {
    font-size: 10px; color: var(--fg-3);
    margin-top: 2px; font-weight: 400;
  }

  .drawer-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #log-drawer .drawer-header { border-bottom-color: rgba(255, 255, 255, 0.1); }
  .drawer-title {
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }
  .drawer-body {
    flex: 1; overflow-y: auto;
    padding: 12px 14px;
  }

  .session-item, .lib-item, .cart-item {
    padding: 10px 12px;
    background: var(--soft-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 6px;
    transition: all 0.15s;
  }
  .session-item { cursor: pointer; }
  .session-item:hover {
    border-color: var(--brand-400);
    transform: translateY(-1px);
  }
  .session-item.active {
    border-color: var(--brand-500);
    background: var(--brand-50);
    box-shadow: 0 4px 14px -4px rgba(16, 185, 129, 0.3);
  }
  .session-item .row, .lib-item .row, .cart-item .row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 4px;
  }
  .session-item .name, .lib-item .name, .cart-item .name {
    font-size: 12px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    flex: 1;
  }
  .session-item .meta, .lib-item .meta, .cart-item .meta {
    font-size: 10px; color: var(--fg-3);
    font-family: ui-monospace, monospace;
  }
  .session-item .actions, .lib-item .actions, .cart-item .actions {
    display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap;
  }
  .session-item .actions button, .lib-item .actions button, .cart-item .actions button {
    padding: 3px 9px; font-size: 10px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--card-bg); color: var(--fg-2); cursor: pointer;
    font-weight: 600;
    transition: all 0.15s;
  }
  .session-item .actions button:hover, .lib-item .actions button:hover, .cart-item .actions button:hover {
    background: var(--soft-hover);
    color: var(--fg-0);
  }
  .session-item .actions button.primary, .lib-item .actions button.primary, .cart-item .actions button.primary {
    background: linear-gradient(135deg, var(--brand-500), var(--brand-600));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 2px 8px -2px rgba(16, 185, 129, 0.4);
  }
  .session-item .actions button.danger, .lib-item .actions button.danger, .cart-item .actions button.danger {
    color: var(--danger);
  }

  .cart-item {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px;
    cursor: grab;
  }
  .cart-item.dragging { opacity: 0.4; cursor: grabbing; }
  .cart-item.drag-over {
    border-color: var(--brand-500);
    border-style: dashed;
    background: var(--brand-50);
  }
  .cart-item .handle {
    color: var(--fg-3); font-size: 12px;
    flex-shrink: 0; cursor: grab;
  }
  .cart-item .cover {
    width: 32px; height: 32px;
    border-radius: 6px;
    object-fit: cover;
    background: var(--soft-bg);
    flex-shrink: 0;
  }
  .cart-item .info { flex: 1; min-width: 0; }
  .cart-item .title {
    font-size: 12px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cart-item .artist {
    font-size: 10px; color: var(--fg-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cart-item .remove {
    background: transparent; border: 0;
    color: var(--fg-3);
    cursor: pointer; font-size: 14px;
    padding: 5px; border-radius: 6px;
    flex-shrink: 0;
    transition: all 0.15s;
  }
  .cart-item .remove:hover {
    background: rgba(239, 68, 68, 0.12);
    color: var(--danger);
  }

  .cart-footer {
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
    flex-shrink: 0;
  }
  .cart-summary {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--fg-2);
  }
  .cart-summary .count {
    font-weight: 800;
    color: var(--brand-600);
    font-size: 14px;
    font-family: ui-monospace, monospace;
  }
  html.dark .cart-summary .count { color: var(--brand-400); }

  .lib-tabs {
    display: flex; gap: 4px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--border);
  }
  .lib-tab {
    padding: 6px 12px;
    background: transparent; border: 0;
    border-bottom: 2px solid transparent;
    color: var(--fg-2); cursor: pointer;
    font-size: 12px; font-weight: 600;
    transition: all 0.15s;
  }
  .lib-tab.active {
    color: var(--brand-600);
    border-bottom-color: var(--brand-500);
  }
  html.dark .lib-tab.active { color: var(--brand-400); }
  .lib-tab .count {
    font-size: 10px;
    background: var(--soft-bg);
    padding: 1px 6px; border-radius: 999px;
    margin-left: 4px;
    font-family: ui-monospace, monospace;
  }
  .lib-tab.active .count {
    background: var(--brand-50);
    color: var(--brand-600);
  }
  html.dark .lib-tab.active .count { color: var(--brand-400); }

  .backdrop {
    position: absolute; inset: 0;
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(4px);
    z-index: 30;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  .empty-chat {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    flex: 1; text-align: center;
    color: var(--fg-3);
    gap: 14px; padding: 40px 20px;
  }
  .empty-chat .big-icon {
    font-size: 44px; opacity: 0.5;
  }
  .empty-chat .hint {
    font-size: 12px; line-height: 1.8;
    max-width: 260px;
  }
  .empty-chat .hint code {
    background: var(--brand-50);
    color: var(--brand-600);
    padding: 2px 6px; border-radius: 6px;
    font-size: 11px;
    font-family: ui-monospace, monospace;
    font-weight: 600;
  }
  html.dark .empty-chat .hint code {
    background: var(--brand-100);
    color: var(--brand-400);
  }
</style>
</head>
<body>

  <!-- 顶部 Header：分层微光排版，彻底解决模型名重叠压缩问题 -->
  <header>
    <div class="header-main">
      <button class="session-btn" id="sessionBtn">
        <span class="dot"></span>
        <span class="name" id="sessionName">未命名会话</span>
        <span style="color:var(--fg-3);font-size:10px;">▾</span>
      </button>
      <div class="header-actions">
        <button class="icon-btn" id="libraryBtn" title="我的内容">📚</button>
        <button class="icon-btn" id="logBtn" title="日志">📋</button>
        <button class="icon-btn" id="themeBtn" title="主题">🌙</button>
        <button class="icon-btn" id="settingsBtn" title="设置">⚙️</button>
      </div>
    </div>
    <div class="header-sub">
      <span class="model-badge off" id="modelBadge">
        <span class="dot"></span>
        <span id="modelName">未配置</span>
      </span>
    </div>
  </header>

  <!-- Git 树流转主视区 (无消息时不画线，有消息时无缝贯通) -->
  <main class="chat" id="chatStream">
    <div class="empty-chat" id="emptyChat">
      <div class="big-icon">🎵</div>
      <div class="hint">
        对我说出你想听的场景，或者让我调整听感。<br>
        试试 <code>深夜写代码的歌</code><br>
        <code>低频再轻一点</code>
      </div>
    </div>
  </main>

  <!-- 悬浮圆角播放栏 (Apple Music 布局重构：左侧播放集群，右侧歌单与宽适音量) -->
  <div class="player" id="player">
    <div class="player-info-row">
      <div class="player-cover-wrap">
        <span class="vinyl-icon">💿</span>
        <img class="player-cover" id="playerCover" src="" alt="" onerror="this.style.visibility='hidden'">
      </div>
      <div class="player-text">
        <div class="player-title" id="playerTitle">未播放</div>
        <div class="player-artist" id="playerArtist">播放队列为空</div>
      </div>
    </div>
    <div class="player-progress-row">
      <span class="player-time" id="playerCurrent">0:00</span>
      <input type="range" class="player-seek" id="playerSeek" min="0" max="100" value="0" step="0.1">
      <span class="player-time" id="playerDuration">0:00</span>
    </div>
    <div class="player-controls">
      <!-- 左侧：经典三键主播放集群 -->
      <div class="player-playback-group">
        <button class="player-btn" id="playerPrev" title="上一首">⏮</button>
        <button class="player-btn primary" id="playerPlay" title="播放/暂停">▶</button>
        <button class="player-btn" id="playerNext" title="下一首">⏭</button>
      </div>
      <!-- 右侧：会话歌单队列 + 宽裕舒适音量条 -->
      <div class="player-actions-group">
        <button class="player-cart-btn" id="cartBtn" title="会话歌单">
          🎵
          <span class="cart-badge hidden" id="cartBadge">+0</span>
        </button>
        <div class="player-volume-wrap">
          <span style="font-size:12px;color:var(--fg-3);">🔊</span>
          <input type="range" class="player-volume" id="playerVolume" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
    </div>
  </div>

  <!-- 最底部的悬浮圆角对话坞 -->
  <footer class="input-bar">
    <button class="dock-toggle" id="dockToggle" title="快捷工具箱">▦</button>
    <textarea id="userInput" rows="1" placeholder="说出你想听的场景、曲风或调音需求…"></textarea>
    <button class="send-btn" id="sendBtn" title="发送">↑</button>
    <button class="stop-btn" id="stopBtn" title="停止">■</button>
  </footer>

  <div class="backdrop" id="backdrop"></div>

  <!-- Session 抽屉 -->
  <aside class="drawer" id="session-drawer">
    <div class="drawer-header">
      <div class="drawer-title">📁 听歌会话</div>
      <button class="icon-btn" id="closeSessionDrawer">✕</button>
    </div>
    <div class="drawer-body" id="sessionList"></div>
    <div style="padding: 12px 14px; border-top: 1px solid var(--border);">
      <button class="btn" id="newSessionBtn" style="width: 100%;">＋ 新建会话</button>
    </div>
  </aside>

  <!-- 会话歌单 抽屉 -->
  <aside class="drawer" id="cart-drawer">
    <div class="drawer-header">
      <div class="drawer-title">
        🎵 会话歌单
        <span class="badge" id="cartHeaderCount">0 首</span>
      </div>
      <button class="icon-btn" id="closeCartDrawer">✕</button>
    </div>
    <div class="drawer-body" id="cartList">
      <div style="text-align:center;color:var(--fg-3);font-size:12px;padding:40px 20px;line-height:1.8;">
        会话歌单是空的<br>
        <span style="font-size:11px;">AI 给出候选后，点「加入歌单」把想听的留下<br>再让 AI 继续检索，会避开已有的歌</span>
      </div>
    </div>
    <div class="cart-footer">
      <div class="cart-summary">
        <span>共 <span class="count" id="cartTotalCount">0</span> 首</span>
        <span style="font-size:11px;color:var(--fg-3);">可拖拽排序</span>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn ghost" id="cartClearBtn" style="flex:0.5;">清空</button>
        <button class="btn" id="cartSettleBtn" style="flex:1;">替换播放并开始</button>
      </div>
    </div>
  </aside>

  <!-- 我的内容 抽屉 -->
  <aside class="drawer" id="library-drawer">
    <div class="drawer-header">
      <div class="drawer-title">📚 我的内容</div>
      <button class="icon-btn" id="closeLibraryDrawer">✕</button>
    </div>
    <div class="lib-tabs">
      <button class="lib-tab active" data-lib="eq">调音<span class="count" id="eqCount">0</span></button>
      <button class="lib-tab" data-lib="playlists">播放列表<span class="count" id="plCount">0</span></button>
    </div>
    <div class="drawer-body" id="libraryBody"></div>
  </aside>

  <!-- 日志 抽屉 -->
  <aside class="drawer" id="log-drawer">
    <div class="drawer-header">
      <div class="drawer-title" style="color:#fafafa;"><span>📋</span> 运行日志</div>
      <div style="display:flex; gap:4px;">
        <button class="icon-btn" id="copyLogsBtn" style="color:#a1a1aa;" title="复制">📄</button>
        <button class="icon-btn" id="closeLogDrawer" style="color:#a1a1aa;">✕</button>
      </div>
    </div>
    <div class="log-content" id="logContent"></div>
  </aside>

  <!-- 快捷工具箱 -->
  <aside class="drawer" id="dock-drawer">
    <div class="drawer-header">
      <div class="drawer-title">⚡ 快捷工具箱</div>
      <button class="icon-btn" id="closeDockBtn">✕</button>
    </div>
    <div style="padding: 0 14px 14px;">
      <div class="dock-grid">
        <button class="dock-item" data-dock="eq">
          <span class="dock-icon">🎛</span>
          <div>
            <div class="dock-text">调整听感</div>
            <div class="dock-sub">打开调音台</div>
          </div>
        </button>
        <button class="dock-item" data-dock="save-list">
          <span class="dock-icon">💾</span>
          <div>
            <div class="dock-text">保存会话歌单</div>
            <div class="dock-sub">存为我的资产</div>
          </div>
        </button>
        <button class="dock-item" data-dock="save-eq">
          <span class="dock-icon">🎚</span>
          <div>
            <div class="dock-text">保存当前调音</div>
            <div class="dock-sub">固化为预设</div>
          </div>
        </button>
        <button class="dock-item" data-dock="search-artist">
          <span class="dock-icon">🎤</span>
          <div>
            <div class="dock-text">歌手全部歌曲</div>
            <div class="dock-sub">跨专辑抓取</div>
          </div>
        </button>
        <button class="dock-item" data-dock="my-playlists">
          <span class="dock-icon">📂</span>
          <div>
            <div class="dock-text">从我的歌单挑歌</div>
            <div class="dock-sub">你补充需求后发送</div>
          </div>
        </button>
        <button class="dock-item" data-dock="scan">
          <span class="dock-icon">🔄</span>
          <div>
            <div class="dock-text">拉取我全部歌单</div>
            <div class="dock-sub">把歌单里的歌作为候选</div>
          </div>
        </button>
      </div>
    </div>
  </aside>

  <script src="sidepanel.js"></script>
</body>
</html>
