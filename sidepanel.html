<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>

  <!-- 顶部 Header：分层微光排版，彻底解决模型名重叠压缩问题 -->
  <header>
    <div class="header-main">
      <button class="session-btn" id="sessionBtn">
        <span class="dot"></span>
        <span class="name" id="sessionName">未命名会话</span>
        <span style="color:var(--fg-3);font-size:10px;">▾</span>
      </button>
      <div class="header-actions">
        <button class="icon-btn" id="libraryBtn" title="我的内容">📚</button>
        <button class="icon-btn" id="logBtn" title="日志">📋</button>
        <button class="icon-btn" id="themeBtn" title="主题">🌙</button>
        <button class="icon-btn" id="settingsBtn" title="设置">⚙️</button>
      </div>
    </div>
    <div class="header-sub">
      <span class="model-badge off" id="modelBadge">
        <span class="dot"></span>
        <span id="modelName">未配置</span>
      </span>
    </div>
  </header>

  <!-- Git 树流转主视区 (无消息时不画线，有消息时无缝贯通) -->
  <main class="chat" id="chatStream">
    <div class="empty-chat" id="emptyChat">
      <div class="big-icon">🎵</div>
      <div class="hint">
        对我说出你想听的场景，或者让我调整听感。<br>
        试试 <code>深夜写代码的歌</code><br>
        <code>低频再轻一点</code>
      </div>
    </div>
  </main>

  <!-- 悬浮圆角播放栏 (Apple Music 布局重构：左侧播放集群，右侧歌单与宽适音量) -->
  <div class="player" id="player">
    <div class="player-info-row">
      <div class="player-cover-wrap">
        <span class="vinyl-icon">💿</span>
        <img class="player-cover" id="playerCover" src="" alt="">
      </div>
      <div class="player-text">
        <div class="player-title" id="playerTitle">未播放</div>
        <div class="player-artist" id="playerArtist">播放队列为空</div>
      </div>
    </div>
    <div class="player-progress-row">
      <span class="player-time" id="playerCurrent">0:00</span>
      <input type="range" class="player-seek" id="playerSeek" min="0" max="100" value="0" step="0.1">
      <span class="player-time" id="playerDuration">0:00</span>
    </div>
    <div class="player-controls">
      <!-- 左侧：经典三键主播放集群 -->
      <div class="player-playback-group">
        <button class="player-btn" id="playerPrev" title="上一首">⏮</button>
        <button class="player-btn primary" id="playerPlay" title="播放/暂停">▶</button>
        <button class="player-btn" id="playerNext" title="下一首">⏭</button>
      </div>
      <!-- 右侧：会话歌单队列 + 宽裕舒适音量条 -->
      <div class="player-actions-group">
        <button class="player-cart-btn" id="cartBtn" title="会话歌单">
          🎵
          <span class="cart-badge hidden" id="cartBadge">+0</span>
        </button>
        <div class="player-volume-wrap">
          <span style="font-size:12px;color:var(--fg-3);">🔊</span>
          <input type="range" class="player-volume" id="playerVolume" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
    </div>
  </div>

  <!-- 最底部的悬浮圆角对话坞 -->
  <footer class="input-bar">
    <button class="dock-toggle" id="dockToggle" title="快捷工具箱">▦</button>
    <textarea id="userInput" rows="1" placeholder="说出你想听的场景、曲风或调音需求…"></textarea>
    <button class="send-btn" id="sendBtn" title="发送">↑</button>
    <button class="stop-btn" id="stopBtn" title="停止">■</button>
  </footer>

  <div class="backdrop" id="backdrop"></div>

  <!-- Session 抽屉 -->
  <aside class="drawer" id="session-drawer">
    <div class="drawer-header">
      <div class="drawer-title">📁 听歌会话</div>
      <button class="icon-btn" id="closeSessionDrawer">✕</button>
    </div>
    <div class="drawer-body" id="sessionList"></div>
    <div style="padding: 12px 14px; border-top: 1px solid var(--border);">
      <button class="btn" id="newSessionBtn" style="width: 100%;">＋ 新建会话</button>
    </div>
  </aside>

  <!-- 会话歌单 抽屉 -->
  <aside class="drawer" id="cart-drawer">
    <div class="drawer-header">
      <div class="drawer-title">
        🎵 会话歌单
        <span class="badge" id="cartHeaderCount">0 首</span>
      </div>
      <button class="icon-btn" id="closeCartDrawer">✕</button>
    </div>
    <div class="drawer-body" id="cartList">
      <div style="text-align:center;color:var(--fg-3);font-size:12px;padding:40px 20px;line-height:1.8;">
        会话歌单是空的<br>
        <span style="font-size:11px;">AI 给出候选后，点「加入歌单」把想听的留下<br>再让 AI 继续检索，会避开已有的歌</span>
      </div>
    </div>
    <div class="cart-footer">
      <div class="cart-summary">
        <span>共 <span class="count" id="cartTotalCount">0</span> 首</span>
        <span style="font-size:11px;color:var(--fg-3);">可拖拽排序</span>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn ghost" id="cartClearBtn" style="flex:0.5;">清空</button>
        <button class="btn" id="cartSettleBtn" style="flex:1;">替换播放并开始</button>
      </div>
    </div>
  </aside>

  <!-- 我的内容 抽屉 -->
  <aside class="drawer" id="library-drawer">
    <div class="drawer-header">
      <div class="drawer-title">📚 我的内容</div>
      <button class="icon-btn" id="closeLibraryDrawer">✕</button>
    </div>
    <div class="lib-tabs">
      <button class="lib-tab active" data-lib="eq">调音<span class="count" id="eqCount">0</span></button>
      <button class="lib-tab" data-lib="playlists">播放列表<span class="count" id="plCount">0</span></button>
    </div>
    <div class="drawer-body" id="libraryBody"></div>
  </aside>

  <!-- 日志 抽屉 -->
  <aside class="drawer" id="log-drawer">
    <div class="drawer-header">
      <div class="drawer-title" style="color:#fafafa;"><span>📋</span> 运行日志</div>
      <div style="display:flex; gap:4px;">
        <button class="icon-btn" id="copyLogsBtn" style="color:#a1a1aa;" title="复制">📄</button>
        <button class="icon-btn" id="closeLogDrawer" style="color:#a1a1aa;">✕</button>
      </div>
    </div>
    <div class="log-content" id="logContent"></div>
  </aside>

  <!-- 快捷工具箱 -->
  <aside class="drawer" id="dock-drawer">
    <div class="drawer-header">
      <div class="drawer-title">⚡ 快捷工具箱</div>
      <button class="icon-btn" id="closeDockBtn">✕</button>
    </div>
    <div style="padding: 0 14px 14px;">
      <div class="dock-grid">
        <button class="dock-item" data-dock="eq">
          <span class="dock-icon">🎛</span>
          <div>
            <div class="dock-text">调整听感</div>
            <div class="dock-sub">打开调音台</div>
          </div>
        </button>
        <button class="dock-item" data-dock="save-list">
          <span class="dock-icon">💾</span>
          <div>
            <div class="dock-text">保存会话歌单</div>
            <div class="dock-sub">存为我的资产</div>
          </div>
        </button>
        <button class="dock-item" data-dock="save-eq">
          <span class="dock-icon">🎚</span>
          <div>
            <div class="dock-text">保存当前调音</div>
            <div class="dock-sub">固化为预设</div>
          </div>
        </button>
        <button class="dock-item" data-dock="search-artist">
          <span class="dock-icon">🎤</span>
          <div>
            <div class="dock-text">歌手全部歌曲</div>
            <div class="dock-sub">跨专辑抓取</div>
          </div>
        </button>
        <button class="dock-item" data-dock="my-playlists">
          <span class="dock-icon">📂</span>
          <div>
            <div class="dock-text">从我的歌单挑歌</div>
            <div class="dock-sub">你补充需求后发送</div>
          </div>
        </button>
        <button class="dock-item" data-dock="scan">
          <span class="dock-icon">🔄</span>
          <div>
            <div class="dock-text">拉取我全部歌单</div>
            <div class="dock-sub">把歌单里的歌作为候选</div>
          </div>
        </button>
      </div>
    </div>
  </aside>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
