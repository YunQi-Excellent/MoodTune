name: CI

on:
  push:
    branches: ['main', 'feature/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # tests/ 只保留在本地开发环境，不纳入版本库：
      # 仓库里没有它时跳过测试，有的话顺带跑一遍。
      - name: Unit tests
        run: |
          if [ -d tests ]; then
            npm test
          else
            echo "tests/ 未纳入版本库，跳过单元测试"
          fi
